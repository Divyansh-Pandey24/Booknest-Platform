# ROUTE 9 — Book Service Static Images (uploads)
spring.cloud.gateway.routes[9].id=book-service-uploads
spring.cloud.gateway.routes[9].uri=lb://BOOK-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/uploads/**
spring.cloud.gateway.routes[9].filters[0]=StripPrefix=0

# ============================================================
# JWT SECRET
# MUST be IDENTICAL to the value in every other service.
# Gateway uses this to VERIFY tokens.
# Auth-service uses this to SIGN tokens.
# Same key = they can verify each other's tokens.
# ============================================================
jwt.secret=${JWT_SECRET:booknest-super-secret-key-must-be-32-chars-min}

# ============================================================
# GATEWAY SECRET
# Injected into every downstream request to prevent header spoofing
# ============================================================
gateway.secret=${GATEWAY_SECRET:booknest-gateway-secret-key-12345}

# ============================================================
# CORS — Allow React to reach the gateway
# ============================================================
# ✅ FIXED — allow both ports
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:5173,http://65.2.12.184,http://localhost:80
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ============================================================
# ACTUATOR
# ============================================================
# ============================================================
# ACTUATOR
# ============================================================
# gateway = exposes all gateway-specific routes/filters info
# * = exposes everything (health, info, env, metrics, loggers, etc.)
# Gateway is WebFlux — actuator path is /actuator/** same as MVC.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================================
# SPRING BOOT ADMIN CLIENT
# ============================================================

# URL of the Admin Server dashboard.
# This service will POST its health/info data to this address on startup.
spring.boot.admin.client.url=http://localhost:9090

# Credentials to authenticate with the Admin Server.
# MUST match spring.security.user.name/password in admin-server.
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin123

# The name this service shows up as in the Admin UI.
spring.boot.admin.client.instance.name=API-GATEWAY

# ============================================================
# LOGGING
# ============================================================
# Shows which route each request matched — great for debugging
logging.level.org.springframework.cloud.gateway=DEBUG
# Change to WARN in production

# ============================================================
# SWAGGER / OPENAPI DOC ROUTES (DEDICATED)
# ============================================================
# We create special routes for Swagger to fetch the JSON docs
# because the regular /api/X routes strip the '/api' prefix, 
# which corrupts the internal '/v3/api-docs' path.

# ROUTE 10 — EBook Service Static Uploads
spring.cloud.gateway.routes[10].id=ebook-uploads
spring.cloud.gateway.routes[10].uri=lb://EBOOK-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/ebook-uploads/**
spring.cloud.gateway.routes[10].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[10].filters[1]=RemoveResponseHeader=X-Frame-Options
spring.cloud.gateway.routes[10].filters[2]=RemoveResponseHeader=Frame-Options

