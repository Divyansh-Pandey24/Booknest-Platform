# ============================================================
# RESILIENCE4J CONFIGURATION (for Gateway)
# ============================================================

# Sliding window size: track last 10 requests
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
# Failure threshold: 50%
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
# Wait 10 seconds before trying the service again
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
# Timeout: cancel if service takes > 3 seconds (default for most services)
resilience4j.timelimiter.configs.default.timeout-duration=10s

# Dedicated longer timeout for image upload routes (Cloudinary can take 15-30s)
resilience4j.timelimiter.instances.bookUploadCB.timeout-duration=30s
resilience4j.circuitbreaker.instances.bookUploadCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.bookUploadCB.failure-rate-threshold=80