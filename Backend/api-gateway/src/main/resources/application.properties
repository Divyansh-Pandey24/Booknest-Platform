# ============================================================
# SERVER
# ============================================================

# Gateway is the ONLY public port.
# React sends EVERY request here.
# No other service port is exposed to the outside world.
server.port=8080

# Name that appears in Eureka dashboard.
# Uppercase is convention for microservice names.
spring.application.name=API-GATEWAY

# ============================================================
# EUREKA — connect to registry
# ============================================================

# Where Eureka server is running.
# Gateway registers itself here on startup.
# Also queries this to find other services.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# How often gateway sends heartbeat to Eureka (seconds).
# Default: 30. We use 10 for faster dev feedback.
eureka.instance.lease-renewal-interval-in-seconds=10

# ============================================================
# ROUTING — the most important gateway config
# Tell gateway: "when request path matches, 
# forward to this service"
# ============================================================

# ROUTE 1 — Auth Service
# Any request to /api/auth/** goes to AUTH-SERVICE
#
# id: unique name for this route (for logging)
# uri: lb://AUTH-SERVICE
#   lb = load balancer = ask Eureka for the address
#   AUTH-SERVICE = must match spring.application.name 
#                  in auth-service exactly
# predicates: the matching condition
#   Path=/api/auth/** means: match any URL starting 
#   with /api/auth/
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=authServiceCB
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/service-unavailable


# ROUTE 2a — Book Service Image Upload (must be BEFORE the generic book route)
# Image uploads to Cloudinary can take 10-30s — needs its own longer timeout
spring.cloud.gateway.routes[1].id=book-service-upload
spring.cloud.gateway.routes[1].uri=lb://BOOK-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/books/upload-image/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=bookUploadCB
spring.cloud.gateway.routes[1].filters[1].args.fallbackUri=forward:/fallback/service-unavailable

# ROUTE 2b — Book Service (general)
spring.cloud.gateway.routes[19].id=book-service
spring.cloud.gateway.routes[19].uri=lb://BOOK-SERVICE
spring.cloud.gateway.routes[19].predicates[0]=Path=/api/books/**
spring.cloud.gateway.routes[19].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[19].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[19].filters[1].args.name=bookServiceCB
spring.cloud.gateway.routes[19].filters[1].args.fallbackUri=forward:/fallback/service-unavailable


